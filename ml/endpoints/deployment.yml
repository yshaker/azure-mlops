$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
# MLflow models need no scoring script or environment: Azure ML generates
# both from the model's signature ("no-code deployment").
name: blue
endpoint_name: churn-endpoint # overridden with --endpoint-name
model: azureml:churn-model@latest
instance_type: Standard_DS3_v2
instance_count: 1
app_insights_enabled: true # latency, failures, request logs -> App Insights
request_settings:
  request_timeout_ms: 5000
  max_concurrent_requests_per_instance: 4
liveness_probe:
  initial_delay: 30
readiness_probe:
  initial_delay: 30
